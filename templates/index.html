<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall-E | 124M Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-yellow-500/30 p-4 shadow-md flex items-center gap-3">
        <div class="w-10 h-10 bg-yellow-500 rounded-md flex items-center justify-center text-gray-900 font-bold text-xl">W</div>
        <div>
            <h1 class="text-lg font-semibold tracking-wide">Wall-E <span class="text-xs text-yellow-400 font-mono ml-2">v1.0 (124M)</span></h1>
            <p class="text-xs text-gray-400">Custom pre-trained & instruction-tuned</p>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto pb-32">
        <!-- System Greeting -->
        <div class="flex gap-4">
            <div class="w-8 h-8 bg-yellow-500 rounded text-gray-900 flex items-center justify-center font-bold flex-shrink-0">W</div>
            <div class="bg-gray-800 p-3 rounded-lg rounded-tl-none text-sm text-gray-200 border border-gray-700 shadow-sm">
                System online. I am a 124M parameter model built from scratch. How can I help you today?
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <div class="fixed bottom-0 w-full bg-gray-800 border-t border-gray-700 p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="Enter an instruction..." 
                class="flex-1 bg-gray-900 text-white border border-gray-600 rounded-md px-4 py-2 focus:outline-none focus:border-yellow-500 transition-colors">
            <button onclick="sendMessage()" 
                class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-semibold px-6 py-2 rounded-md transition-colors shadow-md">
                Send
            </button>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        inputField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            // 1. Append User Message
            chatBox.innerHTML += `
                <div class="flex gap-4 justify-end">
                    <div class="bg-blue-600 p-3 rounded-lg rounded-tr-none text-sm text-white shadow-sm max-w-[80%]">
                        ${text}
                    </div>
                </div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Add temporary typing indicator
            const typingId = "typing-" + Date.now();
            chatBox.innerHTML += `
                <div id="${typingId}" class="flex gap-4">
                    <div class="w-8 h-8 bg-yellow-500 rounded text-gray-900 flex items-center justify-center font-bold flex-shrink-0">W</div>
                    <div class="bg-gray-800 p-3 rounded-lg rounded-tl-none text-sm text-gray-400 italic border border-gray-700">
                        Computing response...
                    </div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. Fetch from API
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                document.getElementById(typingId).remove();
                
                // 4. Append Wall-E Response
                chatBox.innerHTML += `
                    <div class="flex gap-4">
                        <div class="w-8 h-8 bg-yellow-500 rounded text-gray-900 flex items-center justify-center font-bold flex-shrink-0">W</div>
                        <div class="bg-gray-800 p-3 rounded-lg rounded-tl-none text-sm text-gray-200 border border-gray-700 whitespace-pre-wrap shadow-sm">
                            ${data.reply}
                        </div>
                    </div>`;
            } catch (error) {
                document.getElementById(typingId).remove();
                chatBox.innerHTML += `<div class="text-red-400 text-sm italic text-center">Error communicating with server.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
